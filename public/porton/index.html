<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portón</title>
<style>
  :root {
    --bg: #10151c;
    --card: #1a2230;
    --card-on: #14301f;
    --border: #2b3648;
    --text: #e8edf4;
    --muted: #8b98ab;
    --green: #2ecc71;
    --red: #e05260;
    --amber: #e8a33d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 20px; text-align: center; }
  #conexion {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: .85rem; color: var(--muted);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px; margin-bottom: 24px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); flex: none; }
  .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 1000px;
  }
  .rele {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    transition: background .25s, border-color .25s;
  }
  .rele.on { background: var(--card-on); border-color: var(--green); }
  .rele h2 { font-size: 1.05rem; font-weight: 600; }
  .estado { font-size: .8rem; color: var(--muted); min-height: 1.1em; }
  .rele.on .estado { color: var(--green); font-weight: 600; }

  .switch {
    position: relative; width: 70px; height: 36px;
    border-radius: 999px; border: none; cursor: pointer;
    background: #39455a; transition: background .25s;
  }
  .switch::after {
    content: ""; position: absolute; top: 4px; left: 4px;
    width: 28px; height: 28px; border-radius: 50%;
    background: #cfd8e5; transition: left .25s, background .25s;
  }
  .rele.on .switch { background: var(--green); }
  .rele.on .switch::after { left: 38px; background: #fff; }
  .switch:disabled { opacity: .5; cursor: wait; }

  .acciones { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 10px 22px; border-radius: 10px; font-size: .9rem; cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.enc { color: var(--green); }
  .btn.apg { color: var(--red); }
  #aviso { margin-top: 16px; font-size: .85rem; color: var(--red); min-height: 1.2em; text-align: center; max-width: 600px; }

  /* ---------- Programacion horaria ---------- */
  .panel {
    width: 100%; max-width: 1000px; margin-top: 40px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px;
  }
  .panel h2 { font-size: 1.15rem; margin-bottom: 4px; }
  .panel .nota { color: var(--muted); font-size: .8rem; margin-bottom: 18px; }

  .form-prog {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end;
    background: #141b26; border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-bottom: 20px;
  }
  .campo { display: flex; flex-direction: column; gap: 6px; }
  .campo label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  select, input[type=time], input[type=text], input[type=password] {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: .95rem; font-family: inherit;
    color-scheme: dark;
  }
  .dias { display: flex; gap: 6px; flex-wrap: wrap; }
  .dia {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); font-size: .8rem; cursor: pointer;
  }
  .dia.sel { background: var(--green); border-color: var(--green); color: #08130c; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { text-align: left; color: var(--muted); font-size: .72rem; text-transform: uppercase;
       letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .hON { color: var(--green); font-weight: 600; }
  .hOFF { color: var(--red); font-weight: 600; }
  .tag-dia {
    display: inline-block; min-width: 22px; text-align: center;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 4px; margin-right: 3px; font-size: .75rem; color: var(--text);
  }
  .mini {
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: .8rem;
  }
  .mini.borrar { color: var(--red); }
  .mini.pausa { color: var(--amber); }
  .inactivo td { opacity: .45; }
  .vacio { color: var(--muted); text-align: center; padding: 18px !important; }
  #avisoProg { margin-top: 10px; font-size: .85rem; color: var(--red); min-height: 1.2em; }
  .tabla-scroll { overflow-x: auto; }

  /* ---------- Login ---------- */
  #login {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    z-index: 10;
  }
  #login form {
    width: 100%; max-width: 340px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 26px 22px;
    display: flex; flex-direction: column; gap: 14px;
  }
  #login h1 { text-align: center; }
  #login input[type=text], #login input[type=password] { width: 100%; }
  #login .recordar { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
  #loginErr { color: var(--red); font-size: .85rem; min-height: 1.2em; text-align: center; }
  .salir { position: absolute; top: 16px; right: 16px; padding: 6px 12px; font-size: .8rem; }
</style>
</head>
<body>
  <div id="login" hidden>
    <form id="loginForm" autocomplete="on">
      <h1>Portón</h1>
      <div class="campo">
        <label for="lUser">Usuario</label>
        <input type="text" id="lUser" name="username" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="lPass">Contraseña</label>
        <input type="password" id="lPass" name="password" autocomplete="current-password" required>
      </div>
      <label class="recordar"><input type="checkbox" id="lRec" checked> Recordarme en este dispositivo</label>
      <button class="btn enc" type="submit" id="lBtn">Entrar</button>
      <div id="loginErr"></div>
    </form>
  </div>

  <button class="btn salir" onclick="salir()">Salir</button>
  <h1>Portón</h1>
  <div class="sub">Módulo de relés HF-A11 · <span id="ipDisp">…</span></div>
  <div class="sub" id="horaSrv" style="font-size:1rem;color:var(--text)">— · --:--</div>
  <div id="conexion"><span class="dot" id="dot"></span><span id="conTexto">Conectando…</span></div>

  <div class="grid" id="grid"></div>

  <div class="acciones">
    <button class="btn enc" onclick="todos('on')">Encender todos</button>
    <button class="btn apg" onclick="todos('off')">Apagar todos</button>
  </div>
  <div id="aviso"></div>

  <!-- ============ Programación horaria ============ -->
  <div class="panel">
    <h2>⏱️ Programación horaria</h2>
    <div class="nota">Los programas corren en el servidor las 24 horas, aunque cierres esta página. Puedes dejar vacía la hora de encendido o de apagado si solo quieres una de las dos.</div>

    <div class="form-prog">
      <div class="campo">
        <label>Relé</label>
        <select id="fRele">
          <option value="1">Relé 1</option><option value="2">Relé 2</option>
          <option value="3">Relé 3</option><option value="4">Relé 4</option>
          <option value="5">Relé 5</option>
        </select>
      </div>
      <div class="campo">
        <label>Días</label>
        <div class="dias" id="fDias"></div>
      </div>
      <div class="campo">
        <label>Encender a las</label>
        <input type="time" id="fEnc">
      </div>
      <div class="campo">
        <label>Apagar a las</label>
        <input type="time" id="fApg">
      </div>
      <button class="btn enc" onclick="agregarPrograma()">＋ Añadir programa</button>
    </div>

    <div class="tabla-scroll">
      <table>
        <thead>
          <tr><th>Relé</th><th>Días</th><th>Enciende</th><th>Apaga</th><th></th><th></th></tr>
        </thead>
        <tbody id="listaProg"></tbody>
      </table>
    </div>
    <div id="avisoProg"></div>
  </div>

<script>
// Servidor de relés (contenedor "reles" en OVH, publicado por HTTPS)
const API = 'https://porton-api.paolosaxton.com';
const CLAVE_STORE = 'porton_auth';

const NUM_RELES = 5;
const DIAS_NOMBRE = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
const grid = document.getElementById('grid');
const dot = document.getElementById('dot');
const conTexto = document.getElementById('conTexto');
const aviso = document.getElementById('aviso');
const avisoProg = document.getElementById('avisoProg');
const loginBox = document.getElementById('login');
const loginErr = document.getElementById('loginErr');

/* ---------- Sesión ---------- */

let auth = null;
let timer = null;

function leerAuth() {
  try { return localStorage.getItem(CLAVE_STORE) || sessionStorage.getItem(CLAVE_STORE); }
  catch (e) { return null; }
}
function guardarAuth(valor, recordar) {
  try {
    localStorage.removeItem(CLAVE_STORE);
    sessionStorage.removeItem(CLAVE_STORE);
    if (valor) (recordar ? localStorage : sessionStorage).setItem(CLAVE_STORE, valor);
  } catch (e) { /* sin almacenamiento: se pide de nuevo al recargar */ }
}

class NoAutorizado extends Error {}

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers, {Authorization: 'Basic ' + auth});
  const r = await fetch(API + path, Object.assign({}, opts, {headers, cache: 'no-store'}));
  if (r.status === 401) throw new NoAutorizado();
  return r.json();
}

function mostrarLogin(msg) {
  if (timer) { clearInterval(timer); timer = null; }
  loginErr.textContent = msg || '';
  loginBox.hidden = false;
  document.getElementById('lUser').focus();
}

function iniciar() {
  loginBox.hidden = true;
  refrescar();
  cargarProgramas();
  if (!timer) timer = setInterval(refrescar, 5000);
}

document.getElementById('loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const u = document.getElementById('lUser').value.trim();
  const p = document.getElementById('lPass').value;
  const btn = document.getElementById('lBtn');
  btn.disabled = true;
  loginErr.textContent = 'Comprobando…';
  auth = btoa(unescape(encodeURIComponent(u + ':' + p)));
  try {
    await api('/api/horarios');           // valida la clave sin tocar el módulo
    guardarAuth(auth, document.getElementById('lRec').checked);
    document.getElementById('lPass').value = '';
    iniciar();
  } catch (e) {
    auth = null;
    loginErr.textContent = e instanceof NoAutorizado
      ? 'Usuario o contraseña incorrectos'
      : 'No se pudo contactar con el servidor';
  } finally {
    btn.disabled = false;
  }
});

function salir() {
  auth = null;
  guardarAuth(null);
  mostrarLogin();
}

function manejarError(e, destino, texto) {
  if (e instanceof NoAutorizado) { guardarAuth(null); mostrarLogin('La sesión expiró, vuelve a entrar'); return; }
  destino.textContent = texto;
}

/* ---------- Control manual ---------- */

for (let i = 1; i <= NUM_RELES; i++) {
  const card = document.createElement('div');
  card.className = 'rele';
  card.id = 'rele' + i;
  card.innerHTML = `
    <h2>Relé ${i}</h2>
    <button class="switch" onclick="conmutar(${i}, this)" aria-label="Conmutar relé ${i}"></button>
    <div class="estado">—</div>`;
  grid.appendChild(card);
}

function pintar(estados) {
  for (let i = 1; i <= NUM_RELES; i++) {
    const card = document.getElementById('rele' + i);
    const est = estados && estados[String(i)];
    const label = card.querySelector('.estado');
    if (!est || est.on === null) {
      card.classList.remove('on');
      label.textContent = 'desconocido';
    } else if (est.on) {
      card.classList.add('on');
      label.textContent = 'ENCENDIDO';
    } else {
      card.classList.remove('on');
      label.textContent = 'apagado';
    }
  }
}

async function refrescar() {
  if (!auth) return;
  try {
    const d = await api('/api/status');
    if (d.ok) {
      dot.className = 'dot ok';
      conTexto.textContent = 'Conectado';
      aviso.textContent = '';
      pintar(d.reles);
      if (d.hora) document.getElementById('horaSrv').textContent =
        (d.dia || '') + ' ' + (d.fecha || '') + ' · ' + d.hora;
      document.getElementById('ipDisp').textContent = d.dispositivo_ip || '—';
    } else {
      dot.className = 'dot err';
      conTexto.textContent = 'El módulo no está conectado';
      pintar(null);
      let txt = d.error || '';
      if (d.modulo_desde) txt += ' · última conexión: ' + d.modulo_desde;
      aviso.textContent = txt;
      document.getElementById('ipDisp').textContent = 'sin conectar';
    }
  } catch (e) {
    dot.className = 'dot err';
    conTexto.textContent = 'Sin conexión con el servidor';
    manejarError(e, aviso, '');
  }
}

async function mandar(rele, action) {
  try {
    const d = await api('/api/set', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({rele, action})
    });
    if (!d.ok) aviso.textContent = 'El relé ' + rele + ' no respondió: ' + (d.error || d.raw || 'sin respuesta');
    else aviso.textContent = '';
  } catch (e) {
    manejarError(e, aviso, 'Error de comunicación con el servidor');
  }
}

async function conmutar(rele, btn) {
  btn.disabled = true;
  await mandar(rele, 'toggle');
  await refrescar();
  btn.disabled = false;
}

async function todos(action) {
  for (let i = 1; i <= NUM_RELES; i++) await mandar(i, action);
  await refrescar();
}

/* ---------- Programación horaria ---------- */

let programas = [];

const fDias = document.getElementById('fDias');
DIAS_NOMBRE.forEach((n, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'dia';
  b.textContent = n;
  b.dataset.dia = i;
  b.onclick = () => b.classList.toggle('sel');
  fDias.appendChild(b);
});

function pintarProgramas() {
  const tbody = document.getElementById('listaProg');
  tbody.innerHTML = '';
  if (!programas.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="vacio">No hay programas. Añade uno arriba.</td></tr>';
    return;
  }
  programas.forEach((p, idx) => {
    const tr = document.createElement('tr');
    if (!p.activo) tr.className = 'inactivo';
    const dias = p.dias.map(d => '<span class="tag-dia">' + DIAS_NOMBRE[d] + '</span>').join('');
    tr.innerHTML = `
      <td><b>Relé ${Number(p.rele)}</b></td>
      <td>${dias}</td>
      <td class="hON"></td>
      <td class="hOFF"></td>
      <td><button class="mini pausa">${p.activo ? 'Pausar' : 'Activar'}</button></td>
      <td><button class="mini borrar">Borrar</button></td>`;
    tr.querySelector('.hON').textContent = p.encender || '—';
    tr.querySelector('.hOFF').textContent = p.apagar || '—';
    tr.querySelector('.pausa').onclick = () => { programas[idx].activo = !programas[idx].activo; guardarProgramas(); };
    tr.querySelector('.borrar').onclick = () => { programas.splice(idx, 1); guardarProgramas(); };
    tbody.appendChild(tr);
  });
}

async function cargarProgramas() {
  try {
    const d = await api('/api/horarios');
    if (d.ok) { programas = d.horarios; pintarProgramas(); }
  } catch (e) { manejarError(e, avisoProg, ''); }
}

async function guardarProgramas() {
  try {
    const d = await api('/api/horarios', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({horarios: programas})
    });
    if (d.ok) {
      programas = d.horarios;
      avisoProg.textContent = '';
      pintarProgramas();
    } else {
      avisoProg.textContent = d.error || 'Error al guardar';
      cargarProgramas();
    }
  } catch (e) {
    manejarError(e, avisoProg, 'Error de comunicación con el servidor');
  }
}

function agregarPrograma() {
  const rele = parseInt(document.getElementById('fRele').value);
  const dias = [...fDias.querySelectorAll('.dia.sel')].map(b => parseInt(b.dataset.dia));
  const enc = document.getElementById('fEnc').value;
  const apg = document.getElementById('fApg').value;
  if (!dias.length) { avisoProg.textContent = 'Selecciona al menos un día de la semana'; return; }
  if (!enc && !apg) { avisoProg.textContent = 'Pon una hora de encendido, de apagado, o ambas'; return; }
  programas.push({
    id: 'p' + Date.now(),
    rele, dias, encender: enc, apagar: apg, activo: true
  });
  guardarProgramas();
  fDias.querySelectorAll('.dia.sel').forEach(b => b.classList.remove('sel'));
  document.getElementById('fEnc').value = '';
  document.getElementById('fApg').value = '';
}

/* ---------- Arranque ---------- */

auth = leerAuth();
if (auth) iniciar(); else mostrarLogin();
</script>
</body>
</html>
